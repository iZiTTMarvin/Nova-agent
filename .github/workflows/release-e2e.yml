name: Windows Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: Candidate vX.Y.Z version to validate on the selected branch (does not publish)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CI: true
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Validate release metadata
        id: release-metadata
        shell: pwsh
        run: >-
          node scripts/prepare-release.mjs
          --tag "$env:RELEASE_TAG"
          --output "$env:RUNNER_TEMP\release-notes.md"
          --github-output "$env:GITHUB_OUTPUT"

      - name: Install app dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Install Electron E2E harness
        run: npm run test:e2e:install

      - name: Typecheck Electron E2E harness
        run: npm run test:e2e:typecheck

      - name: Build and verify desktop lifecycle
        run: npm run test:e2e

      - name: Build Windows release
        shell: pwsh
        run: |
          npm run build
          npm run sync:icon
          npx electron-builder --config electron-builder.yml --win nsis --publish never

      - name: Verify packaged Electron app
        run: npm --prefix tests/e2e run test:packaged

      - name: Download previously published installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $previous = gh release view --json tagName --jq .tagName
          if ($LASTEXITCODE -ne 0) { throw 'Cannot resolve previous release' }
          if ($previous -eq $env:RELEASE_TAG) { throw 'Release already exists; refusing to replace published assets' }
          $version = $previous.TrimStart('v')
          gh release download $previous --pattern "NovaAgent-Setup-$version.exe" --dir "$env:RUNNER_TEMP"
          if ($LASTEXITCODE -ne 0) { throw 'Cannot download previous installer' }
          "UPGRADE_FROM_VERSION=$version" >> $env:GITHUB_ENV

      - name: Verify previous version upgrade before publication
        run: npm --prefix tests/e2e run test:upgrade

      - name: Preserve upgrade preflight evidence
        uses: actions/upload-artifact@v4
        with:
          name: upgrade-preflight
          path: test-results/e2e
          retention-days: 14

      - name: Upload packaged E2E diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: packaged-electron-e2e-diagnostics
          path: |
            test-results/e2e
            playwright-report/e2e
          if-no-files-found: ignore
          retention-days: 7

      - name: Verify update artifacts
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.release-metadata.outputs.version }}
        run: |
          $releaseDir = Join-Path $env:GITHUB_WORKSPACE 'release'
          $setupName = "NovaAgent-Setup-$env:RELEASE_VERSION.exe"
          $requiredFiles = @(
            $setupName,
            "$setupName.blockmap",
            'latest.yml'
          )

          foreach ($fileName in $requiredFiles) {
            $filePath = Join-Path $releaseDir $fileName
            if (-not (Test-Path -LiteralPath $filePath -PathType Leaf)) {
              throw "缺少发布产物: $filePath"
            }
            if ((Get-Item -LiteralPath $filePath).Length -le 0) {
              throw "发布产物为空: $filePath"
            }
          }

          $latestYml = Get-Content -LiteralPath (Join-Path $releaseDir 'latest.yml') -Raw
          $versionPattern = [regex]::Escape($env:RELEASE_VERSION)
          if ($latestYml -notmatch "(?m)^version:\s*$versionPattern\s*$") {
            throw 'latest.yml 的版本与 package.json 不一致'
          }
          if ($latestYml -notmatch [regex]::Escape("path: $setupName")) {
            throw 'latest.yml 未指向当前版本的 NSIS 安装包'
          }

          $hash = [Convert]::ToBase64String([Security.Cryptography.SHA512]::HashData([IO.File]::ReadAllBytes((Join-Path $releaseDir $setupName))))
          if ($latestYml -notmatch "(?m)^sha512:\s*$([regex]::Escape($hash))\s*$") {
            throw 'latest.yml 的 SHA-512 与安装包不一致'
          }

          Write-Host "已验证 NSIS 安装包、blockmap 与 latest.yml ($env:RELEASE_VERSION)"

      - name: Publish GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release-metadata.outputs.tag }}
          name: Nova Agent ${{ steps.release-metadata.outputs.tag }}
          body_path: ${{ steps.release-metadata.outputs.release_notes_path }}
          generate_release_notes: false
          draft: true
          prerelease: ${{ contains(steps.release-metadata.outputs.tag, '-') }}
          fail_on_unmatched_files: true
          files: |
            release/NovaAgent-Setup-${{ steps.release-metadata.outputs.version }}.exe
            release/NovaAgent-Setup-${{ steps.release-metadata.outputs.version }}.exe.blockmap
            release/latest.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Expose complete release assets
        if: github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ($env:RELEASE_TAG.Contains('-')) {
            gh release edit "$env:RELEASE_TAG" --draft=false --latest=false
          } else {
            gh release edit "$env:RELEASE_TAG" --draft=false --latest
          }
          if ($LASTEXITCODE -ne 0) { throw 'Cannot publish complete release' }

      - name: Verify public GitHub update from previous version
        id: public-upgrade
        if: github.event_name == 'push'
        env:
          UPGRADE_PUBLIC_FEED: 'true'
        run: npm --prefix tests/e2e run test:upgrade

      - name: Withdraw release if public upgrade fails
        if: failure() && steps.public-upgrade.outcome == 'failure'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$env:RELEASE_TAG" --draft

      - name: Upload release acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-acceptance
          path: |
            test-results/e2e
            playwright-report/e2e
          if-no-files-found: ignore
          retention-days: 14
